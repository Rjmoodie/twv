# PDUFA Scraper Rules and Configuration

synonyms:
  complete response letter: [crl, "complete-response letter", "complete response"]
  pdufa: [action date, pdufa date, "prescription drug user fee act"]
  advisory committee: [adcom, "advisory committee meeting", "advisory panel"]

keywords:
  positive:
    - approve
    - approval
    - approves
    - "label expansion"
    - "breakthrough therapy"
    - "fast track"
    - "priority review"
  
  negative:
    - "complete response"
    - delay
    - extend
    - extension
    - reject
    - rejection
    - "clinical hold"
    - "regulatory hold"
  
  regulatory:
    - fda
    - pdufa
    - adcom
    - "advisory committee"
    - "new drug application"
    - nda
    - "biologics license application"
    - bla
    - "investigational new drug"
    - ind

# Company ticker mappings for better recognition
ticker_mappings:
  "Bristol Myers Squibb": BMY
  "Bristol-Myers Squibb": BMY
  "Pfizer": PFE
  "Johnson & Johnson": JNJ
  "Merck": MRK
  "AbbVie": ABBV
  "Eli Lilly": LLY
  "Novartis": NVS
  "Roche": RHHBY
  "Sanofi": SNY
  "GlaxoSmithKline": GSK

# Confidence scoring rules
confidence_rules:
  multi_source_bonus: 0.1  # Bonus for items found in multiple sources
  fda_official_bonus: 0.2  # Bonus for official FDA sources
  recent_bonus: 0.1        # Bonus for recent items
  keyword_match_bonus: 0.1 # Bonus for regulatory keyword matches

