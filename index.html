<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Capacitor / mobile viewport — no scaling, respects safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Construction Project Management for Philadelphia Investors | TW Ventures</title>
  <meta name="description" content="Owner-side renovation and construction project management for Philadelphia real estate investors, with cost visibility, contractor coordination, and accountable oversight." />
  <meta name="author" content="TW Ventures LLC" />
  <meta name="application-name" content="TW Ventures" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://twv-llc.com/" />

  <!-- Local search signals. Geo meta tags are not ranking factors on their own,
       but they are read by some directories and aggregators, and they keep the
       stated service area consistent with the LocalBusiness JSON-LD below. -->
  <meta name="geo.region" content="US-PA" />
  <meta name="geo.placename" content="Philadelphia" />

  <!-- PWA / manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Favicon. Was /logo.png — a 528 KB 1024px master downloaded on every page
       load to render at 16px. logo-192.png is the same mark at 20 KB.
       NOTE: this is the full lockup (wordmark plus tagline) and goes unreadable
       at 16px. A simplified TW monogram would serve better as the tab icon. -->
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />

  <!-- iOS home screen -->
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TW Ventures" />

  <!-- Android / Chrome -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0A0C14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="TW Ventures" />
  <meta property="og:title" content="Construction Project Management for Philadelphia Investors | TW Ventures" />
  <meta property="og:description" content="Owner-side project oversight for real estate investors—not simply a lower-cost general contractor." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://twv-llc.com/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://twv-llc.com/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1536" />
  <meta property="og:image:height" content="1024" />
  <meta property="og:image:alt" content="TW Ventures — Acquire, Build, Manage" />

  <!-- X / Twitter. summary_large_image, not summary: the card art is 1536x1024,
       and `summary` centre-crops it to a small square. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Construction Project Management for Philadelphia Investors | TW Ventures" />
  <meta name="twitter:description" content="Owner-side project oversight for real estate investors—not simply a lower-cost general contractor." />
  <meta name="twitter:image" content="https://twv-llc.com/og-image.jpg" />
  <meta name="twitter:image:alt" content="TW Ventures — Acquire, Build, Manage" />

  <!-- Search engines can understand the business without executing the app. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://twv-llc.com/#organization",
          "name": "TW Ventures LLC",
          "url": "https://twv-llc.com/",
          "logo": "https://twv-llc.com/logo-512.png",
          "image": "https://twv-llc.com/og-image.jpg",
          "description": "Owner-side construction project management and renovation oversight for Philadelphia real estate investors.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Philadelphia",
            "addressRegion": "PA",
            "addressCountry": "US"
          },
          "areaServed": [
            { "@type": "City", "name": "Philadelphia", "sameAs": "https://en.wikipedia.org/wiki/Philadelphia" },
            { "@type": "AdministrativeArea", "name": "Philadelphia County, Pennsylvania" },
            { "@type": "AdministrativeArea", "name": "Greater Philadelphia" }
          ],
          "knowsAbout": [
            "Real estate development",
            "Construction management",
            "Owner representation",
            "Contractor coordination",
            "Renovation budget oversight",
            "Property acquisition",
            "Zoning and entitlements",
            "Multifamily development",
            "Property management"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Acquisitions", "description": "Off-market and on-market sourcing across Philadelphia." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Development", "description": "Entitlements through shovel-ready, with architects, zoning counsel, and engineers." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Investor Construction Project Management", "serviceType": "Owner-side construction project management", "description": "Scope, budget, schedule, contractor, permit, inspection, change-order, progress, and closeout coordination as defined by each engagement." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Stabilization", "description": "Lease-up to a cashflowing asset and refinance." } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Property Management", "description": "Long-term management across the held portfolio." } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://twv-llc.com/#website",
          "url": "https://twv-llc.com/",
          "name": "TW Ventures",
          "publisher": { "@id": "https://twv-llc.com/#organization" },
          "inLanguage": "en-US"
        }
      ]
    }
  </script>
  
  <!-- Apply theme before React mounts to avoid flash and fix status bar race condition -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Premium Typography - Apple-inspired font pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the weights the app actually renders. A grep of the source finds
       font-normal/medium/semibold/bold and nothing else, so 300/800/900 were
       being downloaded for no one. Space Grotesk is applied by a single
       utility class at semibold; JetBrains Mono is used at 400 and 500.
       This is a render-blocking third-party stylesheet, so it lands on LCP. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
