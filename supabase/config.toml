# TW Ventures runs its own Supabase project. Keep this aligned with the hosted
# `twv` project and never point it at SomaTech's project.
#
# This previously read "dkxqmiamrnphjoaznpuo" — somatech's production project,
# inherited with the chassis copy. Every CLI command run from this repo
# (`supabase db push`, `functions deploy`, `db reset`) targeted somatech's live
# database. The build plan says to use a fresh project and warns off the
# configured MCP connection for the same reason; this file was the third way in
# and was not covered by either warning.
project_id = "mtfpwfelsnroslhhmucm"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true

[db]
port = 55322
shadow_port = 55320
major_version = 17

# Keep TW's local stack isolated from the other Supabase projects commonly
# running on this workstation. These are development-only ports.
[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = false
port = 55327
backend = "postgres"

# Both are called by parties that have no user session: Resend's webhook
# delivery, and a mailbox provider's one-click unsubscribe POST. Each
# authorizes itself -- the webhook by Svix signature, the unsubscribe by a
# server-issued bearer token -- so platform JWT verification would only block
# the legitimate caller.
[functions.resend-webhook]
verify_jwt = false

[functions.email-unsubscribe]
verify_jwt = false

# These callers do not have a Supabase user JWT. Each authenticates the request
# itself before touching data: Stripe verifies the signed raw body and the
# notification drain verifies NOTIFICATION_DISPATCH_SECRET.
[functions.stripe-webhook]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false
