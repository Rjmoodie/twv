# TW Ventures runs its own Supabase project. Keep this aligned with the hosted
# `twv` project and never point it at SomaTech's project.
#
# This previously read "dkxqmiamrnphjoaznpuo" — somatech's production project,
# inherited with the chassis copy. Every CLI command run from this repo
# (`supabase db push`, `functions deploy`, `db reset`) targeted somatech's live
# database. The build plan says to use a fresh project and warns off the
# configured MCP connection for the same reason; this file was the third way in
# and was not covered by either warning.
project_id = "mtfpwfelsnroslhhmucm"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
# The site the codes and links belong to. Left at the Supabase default this
# ends up in emails and in any fallback redirect.
site_url = "https://twv-llc.com"
additional_redirect_urls = ["https://twv-llc.com/auth/callback", "https://www.twv-llc.com/auth/callback"]

[auth.email]
# Sign-in is a six-digit code, not a link. A link mailed to a mistyped address
# is a working credential in a stranger's inbox; a code is useless to whoever
# receives it, because it only completes a session already begun elsewhere.
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Auth email goes through Resend, not Supabase's shared sender.
#
# Two reasons. Supabase refuses template edits on the free tier while the
# default provider is in use -- "Email template modification is not available
# for free tier projects using the default email provider" -- so the sign-in
# mail cannot be turned into a code without this. And the default sender puts
# "Supabase Auth" and a Supabase opt-out footer in front of the reader, which is
# the one email every new person sees first.
#
# The password is the Resend API key, read from the environment so it is never
# committed. Set RESEND_API_KEY in .env.local before `supabase config push`.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "services@twv-llc.com"
sender_name = "TW Ventures"

[auth.email.template.magic_link]
subject = "Your TW Ventures sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Your TW Ventures sign-in code"
content_path = "./supabase/templates/confirmation.html"

[db]
port = 55322
shadow_port = 55320
major_version = 17

# Keep TW's local stack isolated from the other Supabase projects commonly
# running on this workstation. These are development-only ports.
[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = false
port = 55327
backend = "postgres"

# Both are called by parties that have no user session: Resend's webhook
# delivery, and a mailbox provider's one-click unsubscribe POST. Each
# authorizes itself -- the webhook by Svix signature, the unsubscribe by a
# server-issued bearer token -- so platform JWT verification would only block
# the legitimate caller.
[functions.resend-webhook]
verify_jwt = false

[functions.email-unsubscribe]
verify_jwt = false

# These callers do not have a Supabase user JWT. Each authenticates the request
# itself before touching data: Stripe verifies the signed raw body and the
# notification drain verifies NOTIFICATION_DISPATCH_SECRET.
[functions.stripe-webhook]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.generate-portfolio-story]
verify_jwt = true
