name: CI/CD Pipeline

# `main` is the only branch this repo has ever had: origin/HEAD points at it and
# neither `master` nor `develop` exists. Triggering on those meant every job
# below was dead config -- CI had never run a single time.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Run linting
      run: npm run lint
      
    - name: Run tests
      run: npm run test
      
    # CI verifies the bundle COMPILES; it does not produce the deployed artifact
    # (Vercel's GitHub integration builds and deploys with real env vars).
    # The escape hatch keeps the production env guard meaningful on Vercel while
    # letting CI build without holding real credentials.
    - name: Build application
      run: npm run build
      env:
        ALLOW_MISSING_SUPABASE: "1"
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/
        retention-days: 1

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history: the secrets scan below reads the whole repository, and
        # the default shallow clone would give it a single commit to look at.
        fetch-depth: 0
      
    - name: Audit production dependencies
      run: npm run security:audit

    - name: Report development dependency advisories
      continue-on-error: true
      run: npm run security:audit:all
      
    # Full-history secrets scan, run through the CLI rather than the action.
    #
    # The action derives its own commit range from the event -- on a push that
    # is `before..after` -- so it only ever sees the newest commits. That is a
    # reasonable ongoing gate but it was never going to cover this repo, which
    # was copied wholesale from another codebase and whose CI had never run:
    # everything committed before today had gone unscanned. `git file:///repo`
    # walks the entire history instead. `--only-verified` keeps findings to
    # secrets confirmed live; `--fail` turns a finding into a red build.
    - name: Check for secrets
      run: |
        docker run --rm -v "$PWD:/repo" \
          ghcr.io/trufflesecurity/trufflehog:3.97.1 \
          git file:///repo --only-verified --fail

# Deployment is handled by Vercel's GitHub integration (push to main → build →
# production). The previous `deploy:` job here used amondnet/vercel-action gated
# on refs/heads/main — a branch that does not exist — so it never ran once.
# Removed rather than fixed, to avoid two systems deploying the same commit.
