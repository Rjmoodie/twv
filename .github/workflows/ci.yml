name: CI/CD Pipeline

# `main` is the only branch this repo has ever had: origin/HEAD points at it and
# neither `master` nor `develop` exists. Triggering on those meant every job
# below was dead config -- CI had never run a single time.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run type checking
      run: npm run typecheck
      
    - name: Run linting
      run: npm run lint
      
    - name: Run tests
      run: npm run test
      
    # CI verifies the bundle COMPILES; it does not produce the deployed artifact
    # (Vercel's GitHub integration builds and deploys with real env vars).
    # The escape hatch keeps the production env guard meaningful on Vercel while
    # letting CI build without holding real credentials.
    - name: Build application
      run: npm run build
      env:
        ALLOW_MISSING_SUPABASE: "1"
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/
        retention-days: 1

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history: the secrets scan below reads the whole repository, and
        # the default shallow clone would give it a single commit to look at.
        fetch-depth: 0
      
    - name: Audit production dependencies
      run: npm run security:audit

    - name: Report development dependency advisories
      continue-on-error: true
      run: npm run security:audit:all
      
    # Scans the entire repository rather than a commit range. A `base`/`head`
    # diff is wrong for this repo on two counts: on a push to `main` the two
    # refs are the same commit, so TruffleHog exits 1 having scanned nothing,
    # and a range scan only ever sees the newest commits -- while this codebase
    # was copied wholesale from another project and CI had never run against it,
    # so anything committed before today had never been scanned at all.
    # `--only-verified` keeps this to secrets confirmed live, not every string
    # shaped like a key.
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

# Deployment is handled by Vercel's GitHub integration (push to main → build →
# production). The previous `deploy:` job here used amondnet/vercel-action gated
# on refs/heads/main — a branch that does not exist — so it never ran once.
# Removed rather than fixed, to avoid two systems deploying the same commit.
